# RQ4 / H3 (P5-20, docs/06 sections 1 and 6): {O1, O3} x {point, gated} acceptance, Tier B only.
# One optimizer run per (variant, seed, limit level) yields a proposal; both acceptance rules judge the same
# proposal, so rows are paired by optimizer run. N = len(seeds) * len(limit_offsets_k) per cell (must be >= 50).
name: rq4
tier: B
seeds: {start: 0, count: 18}        # development seeds; the final run uses the pre-registered fresh seeds
limit_offsets_k: [-5.0, 0.0, 5.0]   # added to each base limit (K, a temperature difference)
base_limits: {pm_peak_limit_degC: 80.0, sw_peak_limit_degC: 130.0}
popsize: 15
maxiter: 50
