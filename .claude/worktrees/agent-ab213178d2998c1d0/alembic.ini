# Used by the `alembic` CLI (e.g. `alembic check`). `reval db upgrade` builds its own config.
# Set REVAL_DATABASE_URL, or pass `-x url=...`; the default is a local SQLite file.
[alembic]
script_location = src/reval/store/migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
