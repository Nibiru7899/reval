version: 1
project: motor-thermal
# Declared limits are study parameters (params/limits.yaml), not manufacturer ratings.
quantities: {pm_peak: degC, sw_peak: degC, shaft_d: mm, is_peak: A}

artifacts:
  measures:    {kind: dataset, path: data/processed/measures.parquet, hasher: dataframe, key: [profile_id, t]}
  splits:      {kind: params, path: splits.yaml}
  drive_map:   {kind: model, path: models/drive_map.joblib, derived_from: [measures, splits]}
  tpm_ridge:   {kind: model, path: models/tpm_ridge.joblib, derived_from: [measures, splits]}
  tpm_hgb:     {kind: model, path: models/tpm_hgb.joblib, derived_from: [measures, splits]}
  tpm_mlp:     {kind: model, path: models/tpm_mlp.joblib, derived_from: [measures, splits]}
  tsw_ridge:   {kind: model, path: models/tsw_ridge.joblib, derived_from: [measures, splits]}
  tsw_hgb:     {kind: model, path: models/tsw_hgb.joblib, derived_from: [measures, splits]}
  tsw_mlp:     {kind: model, path: models/tsw_mlp.joblib, derived_from: [measures, splits]}
  lptn:        {kind: params, path: params/lptn.yaml, derived_from: [measures, splits]}
  # Model-form bands (K, per length class) written by scripts/calibrate_lptn.py next to the fit.
  lptn_report: {kind: params, path: models/lptn_report.json, hasher: yaml-fields, derived_from: [measures, splits, lptn]}
  cooling:     {kind: params, path: params/cooling.yaml}
  limits:      {kind: params, path: params/limits.yaml}
  shaft:       {kind: params, path: params/shaft.yaml}

assumptions:
  A-coolant-range: {statement: "Coolant inlet temperature stays within the tested range", variable: coolant, unit: degC, bounds: [10, 100]}
  A-sensor-pm: {statement: "Magnet temperature telemetry uncertainty (half-width)", variable: pm_sensor_uncertainty, unit: K, value: 2.0}
  A-sensor-sw: {statement: "Stator winding temperature sensor uncertainty (half-width)", variable: sw_sensor_uncertainty, unit: K, value: 2.0}
  A-flow-sens: {statement: "Peak temperature sensitivity to flow_scale is bounded over 0.7-1.3", variable: flow_scale, unit: dimensionless, bounds: [0.7, 1.3]}

requirements:
  R-PM-MAX:  {text: "Magnet temperature stays at or below the declared study limit", quantity: pm_peak, op: "<=", limit: 90, unit: degC, criticality: high}
  R-SW-MAX:  {text: "Stator winding temperature stays at or below the declared study limit", quantity: sw_peak, op: "<=", limit: 130, unit: degC, criticality: medium}
  R-IS-MAX:  {text: "Peak stator current stays at or below the declared inverter limit", quantity: is_peak, op: "<=", limit: 315, unit: A, criticality: medium}
  R-SHAFT-D: {text: "Shaft diameter within the declared tolerance", quantity: shaft_d, op: "<=", limit: 30.05, unit: mm, criticality: low}

subjects_file: subjects.yaml

claims:
  - {id: C-P01-PM, requirement: R-PM-MAX, subject: DC-P01}
