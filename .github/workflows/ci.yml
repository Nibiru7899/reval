name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # reval diff reads lock files at other revisions
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,motor,server]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy src
      - name: Test
        run: pytest -m "not data and not slow" --cov=reval --cov-report=term-missing
      - name: Core coverage gate
        run: pytest tests/unit/core tests/property -m "not slow" --cov=reval.core --cov-fail-under=90
